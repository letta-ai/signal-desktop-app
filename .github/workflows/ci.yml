name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux test dependencies
        run: |
          sudo apt-get install -y xvfb libpulse0 || (
            sudo apt-get update
            sudo apt-get install -y xvfb libpulse0
          )

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          # electron:install-app-deps performs the native rebuild after install.
          NPM_CONFIG_NODE_GYP: echo

      - name: Configure Electron sandbox
        run: |
          ./node_modules/.bin/install-electron
          sudo chown root node_modules/.pnpm/electron@*/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/.pnpm/electron@*/node_modules/electron/dist/chrome-sandbox

      - name: Check dependency policy
        run: node --test .pnpmfile.mjs

      - name: Generate build artifacts
        run: pnpm generate

      - name: Check database schema
        run: pnpm build:db-schema --check

      - name: Check formatting
        run: pnpm lint-prettier

      - name: Check styles
        run: pnpm lint-css

      - name: Check types
        run: pnpm check:types

      - name: Run Oxlint
        run: pnpm oxlint:ci

      - name: Check dependency boundaries
        run: pnpm lint-deps

      - name: Check license comments
        run: pnpm lint-license-comments

      - name: Check internationalization
        run: pnpm lint-intl

      - name: Check unused code
        run: |
          pnpm lint-knip:all --reporter github-actions
          pnpm lint-knip:prod --reporter github-actions

      - name: Run Node and Electron unit tests
        run: xvfb-run --auto-servernum pnpm test-node
        env:
          LANG: en_US
          LANGUAGE: en_US

      - name: Run linter tests
        run: |
          pnpm test-lint-intl
          pnpm test-oxlint

      - name: Check generated files
        run: git diff --exit-code

  danger:
    name: Danger
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install Danger dependencies
        run: pnpm install --frozen-lockfile
        working-directory: danger

      - name: Run DangerJS
        run: pnpm danger:ci
        working-directory: danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.AUTOMATED_GITHUB_PAT || github.token }}
